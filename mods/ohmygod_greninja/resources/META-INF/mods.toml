modLoader="javafml"
loaderVersion="[36,)"
license="MIT"

[[mods]]
modId="ohmygod_greninja"
# build.sh 把版本号写进 jar 清单，Forge 从这里取
version="${file.jarVersion}"
displayName="我的天哪忍蛙大人（智娃）"
authors="TheYjh"
description='''
智娃：小智版甲贺忍蛙的可选增强标记，适配「宝可梦：轻快之旅 v2.4.0」里的回迁核心 1.12.0
（pixelmon_backport 1.12.0）。

模组本身不带战斗逻辑，只提供 ohmygod_greninja 这个 modId；回迁核心检测到它在场时启用：
- 孤忍自修的额外行动；
- 飞水手里剑之后的连续回合水属性威力强化。

客户端和服务端都要装；判定发生在服务端，客户端没装时战斗回合仍会按增强走，但界面上看不到强化提示。
'''

# 这个模组注册了网络频道，两端不一致时按版本匹配处理。
displayTest="MATCH_VERSION"

[[dependencies.ohmygod_greninja]]
    modId="pixelmon_backport"
    mandatory=true
    # 1.0.0 写的是 [1.7.0,1.8.0)，整合包的 1.12.0 落在范围外，FML 直接拒绝加载；
    # 这里改成以 1.12.0 为下限、不设上限，后续核心小版本升级不会再卡住加载。
    versionRange="[1.12.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.ohmygod_greninja]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.16.5,1.17)"
    ordering="NONE"
    side="BOTH"

[[dependencies.ohmygod_greninja]]
    modId="forge"
    mandatory=true
    versionRange="[36.2.42,37)"
    ordering="NONE"
    side="BOTH"
